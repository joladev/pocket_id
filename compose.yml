services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.17.0
    restart: unless-stopped
    environment:
      - APP_URL=${APP_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRUST_PROXY=${TRUST_PROXY}
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

  caddy:
    image: caddy:2.11.6
    restart: unless-stopped
    environment:
      - FIRST_DOMAIN=${FIRST_DOMAIN}
      - FIRST_UPSTREAM=${FIRST_UPSTREAM}
    volumes:
      - ./config:/etc/caddy:ro
      - caddy-data:/data

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${APP_URL}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAINS=${COOKIE_DOMAIN}
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.${COOKIE_DOMAIN}
      - OAUTH2_PROXY_REDIRECT_URL=https://${FIRST_DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true

volumes:
  pocket-id-data:
  caddy-data:
