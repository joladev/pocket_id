services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1
    restart: unless-stopped
    environment:
      - APP_URL=${APP_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRUST_PROXY=${TRUST_PROXY}
      - OTEL_METRICS_EXPORTER=prometheus
      - OTEL_EXPORTER_PROMETHEUS_HOST=0.0.0.0
    volumes:
      - pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      observability.enable: "true"
      observability.service: "pocket-id"
      observability.metrics.port: "9464"
      observability.metrics.path: "/metrics"
    networks:
      - default
      - dokploy-network

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      - FIRST_DOMAIN=${FIRST_DOMAIN}
      - FIRST_UPSTREAM=${FIRST_UPSTREAM}
    volumes:
      - ./config:/etc/caddy:ro
      - caddy-data:/data
    labels:
      observability.enable: "true"
      observability.service: "pocket-id-caddy"
      observability.metrics.port: "9090"
      observability.metrics.path: "/metrics"
    networks:
      - default
      - dokploy-network

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${APP_URL}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAINS=${COOKIE_DOMAIN}
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.${COOKIE_DOMAIN}
      - OAUTH2_PROXY_REDIRECT_URL=https://${FIRST_DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_METRICS_ADDRESS=0.0.0.0:44180
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
    labels:
      observability.enable: "true"
      observability.service: "pocket-id-oauth2-proxy"
      observability.metrics.port: "44180"
      observability.metrics.path: "/metrics"
    networks:
      - default
      - dokploy-network

volumes:
  pocket-id-data:
  caddy-data:

networks:
  default: {}
  dokploy-network:
    external: true
